<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="hotRefrig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="coldRefrig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cabinetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="grilleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- ================= AMBIENT ENERGY MOTION LINES (LEFT SPACE) ================= -->
  <g opacity="0.8">
    <!-- Hot thermal expansion stream -->
    <path d="M 220,300 C 480,240 700,340 920,280" fill="none" stroke="url(#hotRefrig)" stroke-width="5" stroke-linecap="round"/>
    <!-- Cold heat absorption stream -->
    <path d="M 140,480 C 400,430 650,540 950,470" fill="none" stroke="url(#coldRefrig)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 16"/>
    <!-- Geo / Ambient ground thermal waves -->
    <path d="M 280,660 C 520,620 780,700 1060,650" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Floating System Status Indicator -->
    <g transform="translate(360, 390)">
      <circle cx="0" cy="0" r="16" fill="#FEF3C7"/>
      <path d="M -6,4 L 0,-6 L 6,4 Z" fill="#F59E0B"/>
      <text x="24" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B">REVERSING VALVE: HEATING CYCLE</text>
    </g>
    <g transform="translate(200, 580)">
      <circle cx="0" cy="0" r="16" fill="#CCFBF1"/>
      <circle cx="0" cy="0" r="6" fill="#0D9488"/>
      <text x="24" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B">DC INVERTER: 42 Hz MODULATION</text>
    </g>
  </g>

  <!-- ================= ISOMETRIC CONCRETE PAD ================= -->
  <g transform="translate(1080, 680)">
    <polygon points="0,-140 380,50 0,240 -380,50" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="0,-120 350,50 0,220 -350,50" fill="#F1F5F9"/>
    
    <!-- Rubber Anti-Vibration Mounts -->
    <rect x="-180" y="20" width="40" height="15" rx="4" fill="#1E293B"/>
    <rect x="140" y="20" width="40" height="15" rx="4" fill="#1E293B"/>
  </g>

  <!-- ================= INVERTER HEAT PUMP CONDENSER CABINET ================= -->
  <g transform="translate(900, 240)">
    <!-- Shadow -->
    <ellipse cx="180" cy="450" rx="190" ry="40" fill="#64748B" opacity="0.25"/>

    <!-- Cabinet Body (Chassis) -->
    <rect x="0" y="40" width="340" height="390" rx="20" fill="url(#cabinetGrad)" stroke="#94A3B8" stroke-width="3"/>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Inverter Technology Brand Accent -->
    <rect x="25" y="65" width="120" height="24" rx="6" fill="#0F172A"/>
    <text x="85" y="81" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#00E5FF" letter-spacing="1.5">INVERTER PLUS</text>

    <!-- Eco Leaf Badge -->
    <circle cx="300" cy="77" r="14" fill="#DCFCE7"/>
    <path d="M 296,82 C 296,74 304,72 304,72 C 304,72 304,80 296,82 Z" fill="#16A34A"/>

    <!-- Large Circular Axial Fan Grille -->
    <circle cx="170" cy="270" r="120" fill="url(#grilleDark)" stroke="#64748B" stroke-width="4"/>
    
    <!-- Concentric Aero Grille Rings -->
    <circle cx="170" cy="270" r="95" fill="none" stroke="#475569" stroke-width="2.5"/>
    <circle cx="170" cy="270" r="65" fill="none" stroke="#475569" stroke-width="2.5"/>
    <circle cx="170" cy="270" r="35" fill="none" stroke="#475569" stroke-width="2.5"/>

    <!-- High-Efficiency Serrated Fan Blades -->
    <g transform="translate(170, 270)">
      <circle cx="0" cy="0" r="22" fill="#0284C7"/>
      <!-- 3 Aerodynamic Blades -->
      <path d="M 0,-20 C 35,-65 65,-40 20,-10 Z" fill="#38BDF8"/>
      <path d="M 18,10 C 65,35 40,65 10,20 Z" fill="#0284C7"/>
      <path d="M -18,10 C -40,65 -65,40 -20,0 Z" fill="#00B4D8"/>
    </g>

    <!-- Side Service Valves & Refrigeration Line Sets -->
    <!-- Copper Liquid Line (Cool/Cyan insulated) -->
    <g transform="translate(340, 310)">
      <path d="M 0,0 L 70,0 L 70,120 L 140,120" fill="none" stroke="url(#coldRefrig)" stroke-width="12" stroke-linecap="round"/>
      <rect x="-4" y="-10" width="16" height="20" rx="3" fill="#D97706"/>
      <text x="80" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284C7">LIQUID LINE (SUBCOOLED)</text>
    </g>

    <!-- Copper Suction/Hot Gas Line (Warm Amber/Red) -->
    <g transform="translate(340, 250)">
      <path d="M 0,0 L 110,0 L 110,140 L 160,140" fill="none" stroke="url(#hotRefrig)" stroke-width="18" stroke-linecap="round"/>
      <rect x="-4" y="-12" width="18" height="24" rx="4" fill="#B45309"/>
      <text x="120" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F59E0B">VAPOR LINE (HIGH PRESSURE)</text>
    </g>
  </g>

  <!-- ================= COP EFFICIENCY & PERFORMANCE HUD CARD ================= -->
  <g transform="translate(640, 470)">
    <rect x="0" y="0" width="250" height="180" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    
    <!-- Header -->
    <circle cx="24" cy="26" r="6" fill="#38BDF8"/>
    <text x="40" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">HEAT PUMP METRICS</text>

    <!-- SEER2 / COP Dial Graph -->
    <g transform="translate(20, 55)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">COEFFICIENT OF PERF.</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#10B981">4.6 <tspan font-size="14" font-weight="700" fill="#94A3B8">COP</tspan></text>
      
      <!-- Efficiency Radial Arc -->
      <path d="M 170,35 A 25,25 0 1,1 195,15" fill="none" stroke="#334155" stroke-width="6"/>
      <path d="M 170,35 A 25,25 0 1,1 205,30" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
      <text x="188" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">A+++</text>
    </g>

    <!-- Seasonal Energy Efficiency Rating -->
    <line x1="16" y1="125" x2="234" y2="125" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(20, 140)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">SEER2 RATING</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#38BDF8">24.5 High Efficiency</text>
    </g>
  </g>
</svg>