<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Gradients -->
    <linearGradient id="coolFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00838F" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="warmFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>

    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="acGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for crisp high-contrast UI highlights -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND / AMBIENT WAVES (EXTENDING LEFT) ================= -->
  <g opacity="0.85">
    <!-- Cool airflow curves (Teal/Sky Blue) -->
    <path data-motion="flow" d="M 450,220 C 700,180 950,260 1200,210" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.6"/>
    <path data-motion="flow" d="M 320,380 C 600,320 850,440 1150,360" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <path data-motion="flow" d="M 180,480 C 450,420 700,530 980,460" fill="none" stroke="url(#coolFlow)" stroke-width="8" stroke-linecap="round"/>
    <path data-motion="flow" d="M 280,560 C 520,510 740,610 1020,540" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16" opacity="0.5"/>

    <!-- Warm airflow currents (Amber/Orange) -->
    <path data-motion="flow" d="M 500,640 C 720,590 980,680 1240,600" fill="none" stroke="url(#warmFlow)" stroke-width="7" stroke-linecap="round"/>
    <path data-motion="flow" d="M 380,720 C 600,680 820,760 1080,710" fill="none" stroke="#FB8500" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10" opacity="0.5"/>

    <!-- Floating Ambient Micro-Icons (Left & Mid space) -->
    <!-- Cool Snowflake / Air particle -->
    <g data-motion="drift" transform="translate(420, 290) scale(0.9)" opacity="0.75">
      <circle cx="0" cy="0" r="18" fill="#E0F2FE" />
      <path d="M 0,-10 L 0,10 M -10,0 L 10,0 M -7,-7 L 7,7 M -7,7 L 7,-7" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Warm Heat wave mini-badge -->
    <g data-motion="drift" transform="translate(260, 620) scale(0.9)" opacity="0.8">
      <circle cx="0" cy="0" r="20" fill="#FEF3C7" />
      <path d="M -8,6 C -8,0 -4,2 -4,-4 M 0,6 C 0,0 4,2 4,-4 M 8,6 C 8,0 12,2 12,-4" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Floating IoT Wireless node -->
    <g data-motion="drift" transform="translate(610, 480) scale(0.85)" opacity="0.7">
      <circle cx="0" cy="0" r="16" fill="#CCFBF1"/>
      <path d="M -7,4 A 10,10 0 0,1 7,4 M -4,7 A 5,5 0 0,1 4,7" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="9" r="1.5" fill="#0D9488"/>
    </g>
  </g>

  <!-- ================= ISOMETRIC ROOM BASE & PLATFORM ================= -->
  <g transform="translate(1120, 680)">
    <!-- Floor grid planes -->
    <polygon points="0,-120 380,80 0,260 -380,80" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="0,-100 340,80 0,240 -340,80" fill="#F8FAFC"/>
    
    <!-- Sunlit Floor Geometric Shadow/Light Accents -->
    <polygon points="-60,40 180,-80 280,-20 40,100" fill="#E2E8F0" opacity="0.6"/>
    <polygon points="40,100 280,-20 320,10 80,130" fill="#CBD5E1" opacity="0.4"/>
  </g>

  <!-- ================= MODERN WALL HVAC UNIT (TOP RIGHT) ================= -->
  <g transform="translate(1080, 110)">
    <!-- Back drop shadow / wall mount panel -->
    <rect x="-10" y="-10" width="380" height="110" rx="14" fill="#E2E8F0" opacity="0.5"/>
    
    <!-- AC Unit Body -->
    <rect x="0" y="0" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
    <!-- Bottom Vent Flap (Angled Down) -->
    <path d="M 15,72 L 345,72 L 335,86 L 25,86 Z" fill="#0F172A"/>
    <!-- Glow from air vent -->
    <polygon data-motion="pulse" points="25,86 335,86 390,210 -30,210" fill="url(#acGlow)"/>
    
    <!-- Digital Indicator & Logo on AC Unit -->
    <circle cx="315" cy="35" r="4" fill="#10B981"/>
    <text x="295" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0EA5E9">72°</text>
    <rect x="30" y="32" width="45" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="30" y="44" width="28" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Air Discharge Streamlines -->
    <path data-motion="flow" d="M 60,95 C 60,140 30,170 -40,190" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path data-motion="flow" d="M 180,95 C 180,150 160,190 100,230" fill="none" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path data-motion="flow" d="M 300,95 C 300,160 320,200 370,240" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ================= FLOATING SMART THERMOSTAT (WALL UI) ================= -->
  <g transform="translate(860, 240)">
    <!-- Base Plate -->
    <rect x="-10" y="-10" width="160" height="180" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    
    <!-- Outer Glass Bezel -->
    <circle cx="70" cy="70" r="62" fill="url(#charcoalGrad)" stroke="#64748B" stroke-width="3"/>
    
    <!-- LED Arc / Progress Ring -->
    <circle cx="70" cy="70" r="50" fill="none" stroke="#334155" stroke-width="7"/>
    <path data-motion="dash" d="M 35,95 A 50,50 0 1,1 105,95" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle data-motion="pulse" cx="105" cy="95" r="6" fill="#38BDF8"/>
    
    <!-- Thermostat Screen Info -->
    <text x="70" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">72°</text>
    <text x="70" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1.5">COOLING</text>
    
    <!-- Mini Status Icons below Dial -->
    <g transform="translate(70, 145)">
      <!-- Eco Leaf -->
      <path d="M -24,0 C -24,-8 -12,-8 -12,0 C -12,8 -24,8 -24,0 Z" fill="#10B981"/>
      <!-- Target indicator -->
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">ECO AUTO</text>
      <!-- Mode badge -->
      <circle cx="25" cy="0" r="4" fill="#0EA5E9"/>
    </g>

    <!-- Wi-Fi / Sync Waves emitting to technician -->
    <path data-motion="pulse" d="M 160,50 A 25,25 0 0,1 160,90" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
    <path data-motion="pulse" d="M 175,40 A 40,40 0 0,1 175,100" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ================= HVAC TECHNICIAN (ISOMETRIC / FLAT VECTOR) ================= -->
  <g transform="translate(1060, 270)">
    <!-- Shadow beneath Technician -->
    <ellipse cx="140" cy="485" rx="130" ry="32" fill="#64748B" opacity="0.25"/>

    <!-- Left Leg (Back) -->
    <path d="M 105,370 L 95,470 L 130,475 L 140,370 Z" fill="#1E293B"/>
    <!-- Left Shoe -->
    <path d="M 90,465 L 135,465 L 140,485 L 80,485 Z" fill="#0F172A"/>
    <rect x="80" y="480" width="60" height="5" rx="2" fill="#F59E0B"/>

    <!-- Right Leg (Front) -->
    <path d="M 145,370 L 155,475 L 195,470 L 180,370 Z" fill="#334155"/>
    <!-- Right Shoe -->
    <path d="M 150,465 L 205,465 L 215,485 L 145,485 Z" fill="#0F172A"/>
    <rect x="145" y="480" width="70" height="5" rx="2" fill="#F59E0B"/>

    <!-- Tool Belt & Pouch -->
    <path d="M 95,245 L 195,245 L 190,265 L 100,265 Z" fill="#475569"/>
    <rect x="165" y="255" width="30" height="38" rx="4" fill="#0F172A"/>
    <!-- Screwdriver / Tool in pocket -->
    <rect x="175" y="240" width="6" height="20" rx="2" fill="#F59E0B"/>
    <rect x="185" y="245" width="4" height="15" rx="2" fill="#94A3B8"/>

    <!-- Torso / HVAC Uniform Shirt -->
    <path d="M 105,125 L 185,120 L 195,250 L 98,250 Z" fill="#0F766E"/>
    <!-- Chest Trim & Hi-Vis Accent Stripes -->
    <polygon points="105,160 187,155 189,170 103,175" fill="#14B8A6"/>
    <polygon points="103,178 189,173 190,183 102,188" fill="#F59E0B"/>
    
    <!-- ID / Company Badge on Chest -->
    <rect x="115" y="195" width="22" height="28" rx="3" fill="#FFFFFF"/>
    <circle cx="126" cy="204" r="4" fill="#0284C7"/>
    <rect x="119" y="212" width="14" height="3" rx="1" fill="#94A3B8"/>
    <rect x="119" y="217" width="10" height="2" rx="1" fill="#CBD5E1"/>

    <!-- Neck & Head -->
    <polygon points="135,105 155,105 155,125 135,125" fill="#FBCFE8"/>
    <ellipse cx="145" cy="85" rx="26" ry="32" fill="#FBCFE8"/>
    
    <!-- Modern Tech Hair / Headset -->
    <path d="M 120,80 C 120,55 140,48 165,52 C 175,54 178,65 178,75 C 168,70 152,70 140,75 C 130,80 125,82 120,80 Z" fill="#1E293B"/>
    <!-- HVAC Cap (Pro Style) -->
    <path d="M 120,70 C 125,45 165,42 175,65 L 195,68 L 190,76 L 170,74 C 165,80 135,82 120,70 Z" fill="#042F2E"/>
    <path d="M 130,58 L 165,56" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Arm & Hand (Supporting Tablet) -->
    <path d="M 105,130 L 70,195 L 85,215 L 120,165 Z" fill="#0F766E"/>
    <path d="M 70,195 L 30,225 L 45,245 L 85,215 Z" fill="#115E59"/>
    <!-- Left Hand -->
    <circle cx="32" cy="235" r="12" fill="#FBCFE8"/>

    <!-- Right Arm (Active Finger Interacting with Screen) -->
    <path d="M 180,130 L 155,200 L 135,190 L 165,125 Z" fill="#134E4A"/>
    <path d="M 155,200 L 75,230 L 70,210 L 140,185 Z" fill="#0F766E"/>
    <!-- Right Hand / Tapping Index Finger -->
    <circle cx="70" cy="225" r="10" fill="#FBCFE8"/>
    <path d="M 66,225 L 48,212" stroke="#FBCFE8" stroke-width="7" stroke-linecap="round"/>

    <!-- ================= SMART DIGITAL TABLET ================= -->
    <!-- Tablet Body (Angled View) -->
    <g transform="translate(-25, 140) rotate(-12)">
      <!-- Drop Shadow -->
      <rect x="0" y="5" width="125" height="175" rx="14" fill="#0F172A" opacity="0.3"/>
      <!-- Tablet Chassis -->
      <rect x="0" y="0" width="125" height="175" rx="14" fill="#1E293B" stroke="#475569" stroke-width="3"/>
      <!-- Tablet Screen -->
      <rect x="6" y="6" width="113" height="163" rx="10" fill="url(#screenGrad)"/>
      
      <!-- Tablet Screen UI: Header -->
      <rect x="14" y="16" width="50" height="6" rx="3" fill="#38BDF8"/>
      <circle cx="105" cy="19" r="4" fill="#10B981"/>
      <path d="M 90,16 L 98,16" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

      <!-- Tablet Screen UI: Main Dial Graph -->
      <circle cx="62" cy="72" r="34" fill="none" stroke="#334155" stroke-width="6"/>
      <path d="M 40,90 A 32,32 0 1,1 84,90" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
      <text x="62" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">72°</text>
      <text x="62" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#00E5FF">ZONE 01</text>

      <!-- Tablet Screen UI: Sliders & Metric Bars -->
      <!-- Airflow slider -->
      <rect x="14" y="115" width="97" height="12" rx="6" fill="#334155"/>
      <rect x="14" y="115" width="65" height="12" rx="6" fill="url(#tealGrad)"/>
      <circle cx="79" cy="121" r="8" fill="#FFFFFF"/>

      <!-- Temperature mode toggle switches -->
      <rect x="14" y="135" width="45" height="20" rx="6" fill="#0369A1"/>
      <text x="36" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">COOL</text>
      
      <rect x="66" y="135" width="45" height="20" rx="6" fill="#334155"/>
      <text x="88" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#94A3B8">HEAT</text>

      <!-- Interactive Tap Glow Point -->
      <circle data-motion="pulse" cx="50" cy="90" r="14" fill="#00E5FF" opacity="0.3" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- ================= FLOATING METRIC CARDS & ACCENTS ================= -->
  <!-- Air Quality / Efficiency Badge (Floating between Tech & Negative Space) -->
  <g data-motion="rise" transform="translate(730, 480)">
    <rect x="0" y="0" width="170" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="34" cy="32" r="18" fill="#DCFCE7"/>
    <!-- Leaf Icon -->
    <path d="M 28,38 C 28,26 40,24 40,24 C 40,24 40,36 28,38 Z" fill="#16A34A"/>
    <path d="M 28,38 L 36,30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Metric text -->
    <text x="62" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">System Health</text>
    <text x="62" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">98.5% ECO</text>
  </g>

  <!-- Flow Rate Indicator -->
  <g data-motion="rise" transform="translate(930, 620)">
    <rect x="0" y="0" width="150" height="54" rx="12" fill="#0F172A" opacity="0.95"/>
    <circle cx="28" cy="27" r="14" fill="#1E293B"/>
    <!-- Fan spinner icon -->
    <path d="M 28,21 L 28,33 M 22,27 L 34,27" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Air Delivery</text>
    <text x="50" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">450 CFM • Active</text>
  </g>
</svg>