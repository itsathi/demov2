<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="amberGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FB8500" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="chassisDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- ================= AMBIENT DATA & FLOW LINES (LEFT SPACE) ================= -->
  <g opacity="0.75">
    <path d="M 220,280 C 480,240 750,340 1020,290" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12"/>
    <path d="M 140,460 C 420,400 680,500 960,440" fill="none" stroke="url(#skyGrad1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 310,640 C 580,590 820,680 1100,620" fill="none" stroke="url(#amberGrad1)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Floating Telemetry Node Badges -->
    <g transform="translate(380, 360)">
      <circle cx="0" cy="0" r="16" fill="#E0F2FE"/>
      <path d="M -6,0 L 6,0 M 0,-6 L 0,6" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="24" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B">ZONE 04 • STATIC PRESSURE OK</text>
    </g>
    <g transform="translate(240, 560)">
      <circle cx="0" cy="0" r="16" fill="#FEF3C7"/>
      <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
      <text x="24" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B">BMS GATEWAY • 24.8 kW LOAD</text>
    </g>
  </g>

  <!-- ================= ISOMETRIC ROOFTOP PLATFORM ================= -->
  <g transform="translate(1120, 640)">
    <!-- Rooftop Concrete Slab -->
    <polygon points="0,-160 420,60 0,280 -420,60" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="0,-140 390,60 0,260 -390,60" fill="#F8FAFC"/>
    
    <!-- Equipment Vibration Isolator Rails -->
    <polygon points="-240,20 -60,-70 180,50 0,140" fill="#CBD5E1"/>
    <polygon points="-230,25 -70,-55 150,55 -10,135" fill="#94A3B8"/>
  </g>

  <!-- ================= COMMERCIAL ROOFTOP UNIT (RTU) ================= -->
  <g transform="translate(920, 330)">
    <!-- Shadow -->
    <polygon points="40,290 380,120 450,220 110,390" fill="#64748B" opacity="0.3"/>

    <!-- Main Chassis Box (Isometric Projection) -->
    <!-- Left Face -->
    <polygon points="0,90 190,190 190,320 0,220" fill="url(#chassisDark)" stroke="#475569" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="190,190 420,70 420,200 190,320" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Top Face -->
    <polygon points="0,90 230,-30 420,70 190,190" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Louvered Air Intake Grille (Left Face) -->
    <g stroke="#00E5FF" stroke-width="2.5" opacity="0.8">
      <line x1="25" y1="140" x2="165" y2="215"/>
      <line x1="25" y1="160" x2="165" y2="235"/>
      <line x1="25" y1="180" x2="165" y2="255"/>
      <line x1="25" y1="200" x2="165" y2="275"/>
    </g>

    <!-- Heavy-Duty Exhaust Fan Cowl on Top -->
    <ellipse cx="140" cy="75" rx="55" ry="30" fill="#334155" stroke="#00B4D8" stroke-width="3"/>
    <ellipse cx="140" cy="72" rx="42" ry="22" fill="#0F172A"/>
    <!-- Fan Blades / Spinner -->
    <circle cx="140" cy="72" r="10" fill="#00E5FF"/>
    <path d="M 140,62 C 148,50 162,55 158,68 M 148,78 C 160,86 155,98 142,94 M 132,74 C 120,80 114,68 128,66" stroke="#00B4D8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Air Discharge Vortex Gradient -->
    <path d="M 140,50 C 140,-40 180,-70 240,-100" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 160,60 C 180,-10 230,-40 310,-60" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.6"/>

    <!-- Insulated Supply Air Spiral Duct (Right Side Output) -->
    <g>
      <polygon points="340,115 450,60 450,140 340,195" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="450" cy="100" rx="20" ry="40" fill="#0284C7"/>
      <!-- Cool Supply Air Vector arrow -->
      <path d="M 450,100 C 510,70 560,110 600,80" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
      <polygon points="605,75 600,92 588,80" fill="#00E5FF"/>
    </g>

    <!-- Warm Return Air Duct (Rear Intake) -->
    <g>
      <polygon points="260,-15 330,-50 330,0 260,35" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
      <path d="M 370,-80 C 350,-60 320,-40 300,-20" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 8"/>
    </g>
  </g>

  <!-- ================= HOLOGRAPHIC BMS TELEMETRY DASHBOARD (LEFT/MID) ================= -->
  <g transform="translate(680, 210)">
    <!-- HUD Card Container -->
    <rect x="0" y="0" width="280" height="230" rx="18" fill="url(#hudGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="0" y1="48" x2="280" y2="48" stroke="#334155" stroke-width="1.5"/>

    <!-- Header -->
    <circle cx="24" cy="24" r="6" fill="#10B981"/>
    <text x="40" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" letter-spacing="1">RTU-01 TELEMETRY</text>
    <rect x="200" y="14" width="62" height="20" rx="6" fill="#0369A1"/>
    <text x="231" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">ACTIVE</text>

    <!-- Live Metric 1: Airflow Delivery -->
    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">AIR DELIVERY</text>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#00E5FF">4,850 <tspan font-size="13" font-weight="600" fill="#64748B">CFM</tspan></text>
      <!-- Mini bar chart -->
      <rect x="130" y="8" width="10" height="18" rx="2" fill="#0284C7"/>
      <rect x="145" y="0" width="10" height="26" rx="2" fill="#00E5FF"/>
      <rect x="160" y="5" width="10" height="21" rx="2" fill="#00E5FF"/>
      <rect x="175" y="12" width="10" height="14" rx="2" fill="#334155"/>
    </g>

    <!-- Live Metric 2: Supply vs Return Temp -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="115" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">SUPPLY TEMP</text>
      <text x="12" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">54.2°F</text>

      <rect x="125" y="0" width="115" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="137" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FB8500">RETURN TEMP</text>
      <text x="137" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">73.8°F</text>
    </g>

    <!-- Connection Line from HUD to RTU Sensor -->
    <path d="M 280,115 L 350,115 L 390,160" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="4 6"/>
    <circle cx="390" cy="160" r="5" fill="#00E5FF"/>
  </g>
</svg>